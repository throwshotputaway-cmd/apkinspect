[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apkinspect"
version = "0.4.0"
description = "Static decryptors and unpackers for packed Android APKs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
keywords = ["android", "apk", "reverse-engineering", "security", "unpacker"]

[project.optional-dependencies]
dpt = [
    "androguard>=4.1",
]
elf = [
    "lief>=0.14",
    "capstone>=5",
]
ui = [
    "rich>=13",
]
all = [
    "androguard>=4.1",
    "lief>=0.14",
    "capstone>=5",
    "rich>=13",
]
dev = [
    "build>=1.0",
    "mypy>=1.13,<2.0",
    "rich>=13",
    "ruff>=0.8",
]

[project.scripts]
apkinspect = "apkinspect.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apkinspect*"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
files = ["apkinspect"]
ignore_missing_imports = true
check_untyped_defs = false
no_implicit_optional = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["rich.*"]
follow_imports = "skip"
